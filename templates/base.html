<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title or 'Chatting' }}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand" href="{{ url_for('chat') }}">Chatting</a>
        <div class="d-flex align-items-center gap-3 ms-auto">
          {% if session.get('username') %}
          <span class="text-white small">Halo, {{ session.get('username') }}!</span>
          <a class="btn btn-sm btn-outline-light" href="{{ url_for('logout') }}">Logout</a>
          {% else %}
          <a class="btn btn-sm btn-outline-light" href="{{ url_for('login') }}">Login</a>
          <a class="btn btn-sm btn-light" href="{{ url_for('register') }}">Register</a>
          {% endif %}
        </div>
      </div>
    </nav>
    <main class="container py-4">
      {% block content %}{% endblock %}
    </main>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
