{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card shadow-sm chat-panel active" id="chat-panel">
      <div class="card-header d-flex justify-content-between align-items-center">
        <div>
          <h3 class="h5 mb-0">Ruang Obrolan</h3>
          <small class="text-muted">Semua pesan dibagikan ke seluruh pengguna yang login.</small>
        </div>
        <span class="badge bg-success">online</span>
      </div>
      <div class="card-body d-flex flex-column">
        <div class="messages flex-grow-1 mb-3" id="messages"></div>
        <form id="message-form" class="input-group">
          <input
            id="message-input"
            type="text"
            class="form-control"
            placeholder="Ketik pesan..."
            autocomplete="off"
            required
          />
          <button type="submit" class="btn btn-success">Kirim</button>
        </form>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
  const socket = io();
  const currentUser = {{ username|tojson }};
  const messagesEl = document.getElementById('messages');
  const messageForm = document.getElementById('message-form');
  const messageInput = document.getElementById('message-input');

  const formatTime = (timestamp) =>
    new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

  const renderMessage = (payload, type = 'message') => {
    const row = document.createElement('div');

    if (type === 'system') {
      row.className = 'system-message text-center text-muted';
      row.textContent = payload.message;
    } else {
      const isMe = payload.username === currentUser;
      row.className = `message-row ${isMe ? 'me' : 'other'}`;

      const bubble = document.createElement('div');
      bubble.className = `message-bubble ${isMe ? 'me' : 'other'}`;

      const meta = document.createElement('div');
      meta.className = 'message-meta';
      meta.textContent = `${payload.username} • ${formatTime(payload.timestamp)}`;

      const body = document.createElement('div');
      body.className = 'message-text';
      body.textContent = payload.content;

      bubble.append(meta, body);
      row.appendChild(bubble);
    }

    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  };

  const loadHistory = async () => {
    messagesEl.innerHTML = '';
    const res = await fetch('/messages');
    const history = await res.json();
    history.forEach((item) => renderMessage(item));
  };

  messageForm.addEventListener('submit', (event) => {
    event.preventDefault();
    const message = messageInput.value.trim();
    if (!message) return;
    socket.emit('send_message', { message });
    messageInput.value = '';
  });

  socket.on('new_message', (payload) => {
    renderMessage(payload);
  });

  socket.on('system', (payload) => {
    renderMessage(payload, 'system');
  });

  loadHistory();
</script>
{% endblock %}
